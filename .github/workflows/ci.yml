name: CI — Lint & Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─────────────────────────────────────────
  # Backend: Go Lint & Test
  # ─────────────────────────────────────────
  backend-test:
    name: Backend (Go) — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -timeout 60s

  # ─────────────────────────────────────────
  # Frontend: Next.js Lint & Build Check
  # ─────────────────────────────────────────
  frontend-lint:
    name: Frontend (Next.js) — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build check
        run: npm run build
