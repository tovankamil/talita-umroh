name: CD — Build & Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Build & Push Docker Images
      # ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talita-umroh-api:latest

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talita-umroh-web:latest

      # ─────────────────────────────────────────
      # Deploy ke VPS via SSH
      # ─────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/talita-umroh

            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/talita-umroh-api:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/talita-umroh-web:latest

            # Restart services with zero downtime
            docker-compose pull
            docker-compose up -d --no-deps --build api web

            # Cleanup old images
            docker image prune -f

            echo "✅ Deploy selesai: $(date)"
